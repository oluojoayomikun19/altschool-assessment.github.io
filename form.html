<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALT SCHOOL application form</title>
  <script src="/index.js"></script>
</head>
<body>
  <ul>
    <li><a href="/index.html">First Assessment</a></li>
    <li><a href="./form.html">ALT SCHOOL application form </a></li>
  </ul>
  <p>Welcome to ALT SCHOOL application form </p>
  <h1>Create Your ALT School Account</h1>
  <form action="">
    <label for="">Email</label><br>
    <input type="email" name="email" placeholder="john.doe@email.com" required><br><br>
    <label for="">First name</label> <br>
    <input type="text" name="firstname" placeholder="john" required><br><br>
    <label for="">Last name</label><br>
    <input type="text" name="lastname" placeholder="Doe" required><br><br>
    <label for="">Phone number</label> <br>
    <input type="number" name="phone number" placeholder="+1234567890" required><br><br>
    <label for="">Password</label><br>
    <input type="password" name="password" placeholder="*********" required> <br><br>
    <label for="">Confirm password</label><br>
    <input type="password" name="password" placeholder="*********" required><br><br>
    <label for="">Choose your track</label><br>
    <select name="Choose your Track" required>
      <option value="0">Select 1 course</option>
      <option value="1">Product management</option>
      <option value="2">Fullstack Engineering</option>
      <option value="3">Cyber Security</option>
      <option value="4">Data Analysis</option>
      <option value="5">Cloud Engineering</option>
    </select><br><br>
    <input type="checkbox"> I agree to the terms and condition <br><br>
    <button>Create account</button>
  </form><br>
  <footer>
    &copy; 2026 altschool africa
  </footer>
</body>
</html>
